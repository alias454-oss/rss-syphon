# DO NOT ADD CREDENTIALS HERE
# Create the .env and edit the values there

# cp syphon.conf syphon.toml
# chmod 600 syphon.toml

# RSS-Syphon global configuration. Profiles only define their own jobs,
# feed data, output routing, and destination-specific settings.

[system]
default_profile = "security"
profiles_dir = "./profiles"
root_data_dir = "./output"

# Set default logging level and format. LOG_LEVEL and LOG_FORMAT still override
# these values when exported in the process environment.
log_level = "INFO"
log_format = "%(levelname)s:%(name)s: %(message)s"

# Global module configuration
#
# Globally enabled modules are available to all profiles.
# A profile may reference a disabled module; the dispatcher logs
# the skip and continues processing.
#
# Available modules:
#   files    - Write JSON to stdout or daily JSON snapshots and text reports
#   slack    - Send results to Slack
#   notion   - Send results to Notion databases
#   zendesk  - Create Zendesk tickets
#   splunk   - Retrieve dynamic keyword data (input integration)
#
# Enable only modules available to profiles on this installation.
# Example: enabled = ["files", "slack", "notion", "zendesk", "splunk"]

[modules]
enabled = ["files"]

# Set Slack Configuration parameters
[modules.slack]
slack_token = "env:SLACK_TOKEN"

# Set Zendesk Configuration parameters
[modules.zendesk]
zendesk_token = "env:ZENDESK_TOKEN"

# Set Notion Configuration parameters
[modules.notion]
notion_token = "env:NOTION_TOKEN"

# Set Splunk environment parameters
[modules.splunk]
splunk_api_user = "env:SPLUNK_API_USER"
splunk_api_pass = "env:SPLUNK_API_PASS"

